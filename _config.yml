title: Olivia Prior
description: A simple, clean static website using Jekyll.
baseurl: "" # e.g. /blog
url: "https://username.github.io" # the base hostname & protocol for your site
theme: minima

# Build settings
markdown: kramdown
kramdown:
  input: GFM

# Navigation
nav:
  - title: Research
    url: /research/
  - title: Writing
    url: /writing/
  - title: Others
    url: /others/

# Social links
social:
  github: https://github.com/theanega
  linkedin: https://linkedin.com/in/oliviaprior
  twitter: https://twitter.com/theanega
  youtube: https://youtube.com/@camilasiesta

# Resume links
resume: /assets/files/resume.pdf
anti_resume: /assets/files/anti-resume.pdf

# Add to your existing config
defaults:
  -
    scope:
      path: ""
    values:
      lang: "en"
  -
    scope:
      path: "es"
    values:
      lang: "es"
  -
    scope:
      path: "ca"
    values:
      lang: "ca"
