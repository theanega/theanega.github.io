title: Olivia Prior
description: A collection of thoughts, research, and digital explorations.
baseurl: "" 
url: "https://theanega.github.io"
theme: minima

# Build settings
markdown: kramdown
kramdown:
  input: GFM

nav:
  - title: Research
    url: /research/
  - title: Notes
    url: /notes/


# Social links (keeping these as they are)
social:
  github: https://github.com/theanega
  linkedin: https://linkedin.com/in/oliviaprior
  twitter: https://twitter.com/theanega
  youtube: https://youtube.com/@camilasiesta

# Resume links (keeping these as they are)
resume: /assets/files/resume.pdf
anti_resume: /assets/files/anti-resume.pdf

# Archives
tag_archive:
  type: liquid
  permalink: /tags/ 

# Collections
collections:
  archives:
    output: true
    permalink: /archive/
  notes:
    output: true
    permalink: /notes/

defaults:
#_pages
  - scope:
      path: ""
      type: pages
    values:
      layout: "page"

#_posts
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
      planted: "" # Will be filled with creation date
      tended: "" # Will be filled with last modified date



# Add tag support
tag_page_layout: tag_page
tag_page_dir: tags

include:
  - _pages
  - _notes
  - _research
  - _tags