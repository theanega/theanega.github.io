title: Olivia Prior
description: Just sharing.
baseurl: ""
url: "https://theanega.github.io"

# Post URLs (explicit = stable if defaults ever change)
permalink: "/:year/:month/:day/:title.html"

# Build settings
future: true
markdown: kramdown
kramdown:
  input: GFM

# Primary navigation (Lists / Talks hidden until ready — pages still exist at /lists/, /talks/)
header_nav:
  - label: About
    url: /
  - label: Blog
    url: /blog/
  - label: Projects
    url: /projects/
  - label: Research
    url: /research/
  - label: CV
    url: /cv/

# Social links
social:
  github: https://github.com/theanega
  bluesky: https://bsky.app/profile/theanega.bsky.social
  googlescholar: https://scholar.google.com/citations?user=-H_0M20AAAAJ&hl=es
  linkedin: https://linkedin.com/in/oliviaprior
  twitter: https://twitter.com/theanega

# Resume / CV asset (optional; CV page will be expanded later)
resume: /assets/files/resume.pdf

# Archives
tag_archive:
  type: liquid
  permalink: /tags/

defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: "default"

  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: "note"

# Add tag support
tag_page_layout: tag_page
tag_page_dir: tags

include:
  - _pages
  - _research
  - _tags
  - assets

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
