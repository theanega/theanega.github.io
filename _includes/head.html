<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <!-- so that the website looks good with any screen size -->

    {%- seo -%}

    <!-- All your stylesheets -->
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/notes.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    
    
    <!-- Your favicon -->
    <link rel="icon" type="image/png" href="{{ "/assets/images/theanega_Small_Logo.png" | relative_url }}">
    
    <!-- Feed meta and analytics -->
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
        {%- include google-analytics.html -%}
    {%- endif -%}
    
    <!-- Your custom styles -->
    <style>
        body {
            max-width: 800px;
            margin: 2rem auto;
            /* ... rest of your styles ... */
        }
        .social-icons {
          display: flex;
          gap: 1rem;
          justify-content: center;
        }
        
        .social-icons img {
            width: 24px;  /* You can adjust this value */
            height: 24px; /* Keep it the same as width for perfect squares */
        }
        
        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
    </style>
</head>
