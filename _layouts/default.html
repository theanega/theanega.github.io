<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}{% if page.title %} - {{ page.title }}{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            margin-bottom: 0.5rem;
            border-bottom: 0.5px solid #eee;
            padding-bottom: 1rem;
        }
        header h1 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: -0.02em; 
        }
        nav {
            margin-top: 0.5rem;
        }
        nav a {
            margin-right: 1.5rem;
            color: #333;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            margin-top: 0.5rem;
            flex: 1;
        }
        footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 0.5px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .social-icons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .social-icons img {
            width: 24px;
            height: 24px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .social-icons img:hover {
            opacity: 1;
        }
        .copyright {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Olivia Prior</h1>
        <nav>
            <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
            <a href="/research" {% if page.url == "/research" %}class="active"{% endif %}>Research</a>
            <a href="/notes" {% if page.url == "/notes" %}class="active"{% endif %}>Notes</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <div class="social-icons">
            <a href="{{ site.social.github }}" target="_blank">
                <img src="/assets/images/github.svg" alt="GitHub">
            </a>
            <a href="{{ site.social.linkedin }}" target="_blank">
                <img src="/assets/images/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="{{ site.social.twitter }}" target="_blank">
                <img src="/assets/images/twitter.svg" alt="Twitter">
            </a>
            <a href="{{ site.social.youtube }}" target="_blank">
                <img src="/assets/images/youtube.svg" alt="YouTube">
            </a>
        </div>
        <div class="copyright">
            © {{ site.time | date: "%Y" }} Olivia Prior
        </div>
    </footer>
</body>
</html>
