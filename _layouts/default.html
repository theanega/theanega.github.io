<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <header>
        <nav class="main-nav">
            <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
            <a href="/research" {% if page.url == "/research" %}class="active"{% endif %}>Research</a>
            <a href="/writing" {% if page.url == "/writing" %}class="active"{% endif %}>Writing</a>
            <a href="/others" {% if page.url == "/others" %}class="active"{% endif %}>Others</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </footer>
</body>
</html>
