---
layout: default
---
<article class="note">
    <h2>{{ page.title }}</h2>
    <div class="meta">
        Planted: {{ page.date | date: "%Y-%m-%d" }}
        {% if page.tended %} • Last tended: {{ page.tended | date: "%Y-%m-%d" }}{% endif %}
        {% if page.tags %}
        <div class="tags">
            {% for tag in page.tags %}
            <a href="/tags/{{ tag }}" class="tag">#{{ tag }}</a>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    {{ content }}
</article>
